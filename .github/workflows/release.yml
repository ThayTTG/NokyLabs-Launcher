name: Build e Release

# Lança uma versão nova do NokyLabs Launcher para Windows e Linux.
#
# Como disparar:
#   • enviar qualquer commit para o branch "release"  → a tag vem do <Version> do .csproj
#   • ou enviar uma tag no formato v1.2.3
#
# Se a versão já foi lançada, o workflow para logo no começo e pede para aumentar o <Version>.
#
# Arquivos publicados (nomes fixos, usados pelo site e pela autoatualização):
#   NokyLabs-win-x64.zip    → NokyLabs.exe
#   NokyLabs-linux-x64.zip  → NokyLabs
on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJETO: src/NokyLabs/NokyLabs.csproj

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJETO")
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir se a versão é nova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Versão já lançada::A versão $tag já existe. Aumente o <Version> no NokyLabs.csproj (ex.: 0.6.0 → 0.6.1) e envie de novo para o branch release."
            exit 1
          fi
          echo "A versão $tag é nova. Seguindo com o lançamento."

      # O launcher leva uma cópia do catálogo para funcionar offline: pega a mais recente do site.
      - name: Catálogo embutido atualizado
        run: |
          if curl -fsSL https://thayttg.github.io/nokylabs/catalogo.json -o novo.json \
             && python3 -I .github/scripts/conferir_json.py novo.json; then
            mv novo.json src/NokyLabs/Assets/catalogo.json
            echo "Catálogo do site embutido."
          else
            echo "::warning::Não consegui baixar o catálogo do site; vai a cópia que está no repositório."
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: catalogo
          path: src/NokyLabs/Assets/catalogo.json

  windows:
    needs: versao
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: catalogo
          path: src/NokyLabs/Assets
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Publicar (win-x64, arquivo único)
        run: >
          dotnet publish ${{ env.PROJETO }} -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path publish\NokyLabs.exe -DestinationPath NokyLabs-win-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: NokyLabs-win-x64.zip

  linux:
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: catalogo
          path: src/NokyLabs/Assets
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Publicar (linux-x64, arquivo único)
        run: >
          dotnet publish ${{ env.PROJETO }} -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish
      - name: Compactar (mantendo a permissão de execução)
        run: |
          chmod +x publish/NokyLabs
          cd publish && zip -9 ../NokyLabs-linux-x64.zip NokyLabs
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: NokyLabs-linux-x64.zip

  release:
    needs: [versao, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Notas da versão (CHANGELOG.md)
        id: notas
        run: python3 .github/scripts/notas_da_versao.py ler "${{ needs.versao.outputs.tag }}" CHANGELOG.md
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Calcular SHA-256
        run: sha256sum NokyLabs-*.zip | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.versao.outputs.tag }}
          name: NokyLabs Launcher ${{ needs.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            NokyLabs-win-x64.zip
            NokyLabs-linux-x64.zip
            SHA256SUMS.txt
          body: |
            ## NokyLabs Launcher ${{ needs.versao.outputs.tag }}

            ### O que há de novo
            <!-- novidades -->
            ${{ steps.notas.outputs.texto }}
            <!-- /novidades -->

            Instale, abra e mantenha todos os apps da NokyLabs atualizados, num só lugar.

            **Windows:** baixe o `NokyLabs-win-x64.zip`, extraia e abra o `NokyLabs.exe`. O assistente cuida do resto.
            Se aparecer o aviso azul do Windows, clique em "Mais informações" › "Executar assim mesmo".

            **Linux:** baixe o `NokyLabs-linux-x64.zip`, extraia e rode `./NokyLabs`.

            Não precisa instalar o .NET. Mais detalhes: https://thayttg.github.io/nokylabs/#launcher

      # Se as notas vieram da seção "Não lançado", ela vira a seção desta versão no CHANGELOG do main.
      - name: Registrar a versão no CHANGELOG
        if: steps.notas.outputs.promover == 'sim'
        shell: bash
        env:
          PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth 1 origin "$PRINCIPAL"
          git checkout -f -B registrar-changelog "origin/$PRINCIPAL"
          python3 .github/scripts/notas_da_versao.py promover "${{ needs.versao.outputs.tag }}" CHANGELOG.md
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "CHANGELOG: versão ${{ needs.versao.outputs.tag }}"
          git push origin "HEAD:$PRINCIPAL" || echo "::warning::Não consegui registrar a versão no CHANGELOG; ajuste à mão."
